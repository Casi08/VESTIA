kind = "mobile"
previewPath = "/"
title = "VESTIA"
description = "VESTIA is a wardrobe companion that helps you organize clothing, plan outfits, and discover looks with styling assistance."
version = "1.0.0"
id = "artifacts/vestia-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22043

[services.development]
run = "pnpm --filter @workspace/vestia-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vestia-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vestia-app", "run", "serve" ]

[services.env]
PORT = "22043"
BASE_PATH = "/"
